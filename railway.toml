[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "sh -c 'echo Starting... && php artisan --version && echo Migrating... && php artisan migrate --force 2>&1 && echo Starting server... && php artisan serve --host=0.0.0.0 --port=$PORT 2>&1'"
healthcheckPath = ""
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
